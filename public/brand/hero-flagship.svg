<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="iPhone 17 Pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="0.55" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#0a84ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e8ed"/>
      <stop offset="0.5" stop-color="#b8b8c0"/>
      <stop offset="1" stop-color="#6e6e76"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2d6b"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f0a"/>
      <stop offset="0.5" stop-color="#ff375f"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="40" stdDeviation="50" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="500" rx="520" ry="260" fill="url(#glow)"/>
  <ellipse cx="600" cy="690" rx="360" ry="38" fill="#000" opacity="0.45"/>

  <!-- Back phone (tilted) -->
  <g transform="translate(300 250) rotate(-14 150 240)" filter="url(#shadow)">
    <rect x="20" y="20" width="300" height="620" rx="58" fill="url(#frame)"/>
    <rect x="34" y="34" width="272" height="592" rx="48" fill="#0b0b0d"/>
    <rect x="60" y="78" width="120" height="120" rx="30" fill="url(#screen2)" opacity="0.95"/>
    <rect x="195" y="78" width="55" height="55" rx="16" fill="#1c1c1f" stroke="#3a3a3d" stroke-width="2"/>
    <circle cx="222" cy="105" r="9" fill="#0a0a0c"/>
    <circle cx="222" cy="105" r="4" fill="#1d4ed8" opacity="0.6"/>
  </g>

  <!-- Front phone (hero) -->
  <g transform="translate(560 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="650" rx="62" fill="url(#frame)"/>
    <rect x="14" y="14" width="292" height="622" rx="50" fill="#050507"/>
    <rect x="26" y="26" width="268" height="598" rx="40" fill="url(#screen)"/>
    <!-- screen content -->
    <g opacity="0.92">
      <rect x="56" y="150" width="208" height="16" rx="8" fill="#ffffff" opacity="0.85"/>
      <rect x="56" y="184" width="150" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
      <rect x="56" y="226" width="208" height="96" rx="20" fill="#ffffff" opacity="0.18"/>
      <rect x="56" y="338" width="100" height="100" rx="22" fill="#ffffff" opacity="0.16"/>
      <rect x="164" y="338" width="100" height="100" rx="22" fill="#ffffff" opacity="0.16"/>
      <rect x="56" y="456" width="208" height="44" rx="22" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- dynamic island -->
    <rect x="118" y="44" width="84" height="28" rx="14" fill="#000"/>
    <!-- side highlight -->
    <rect x="0" y="80" width="4" height="180" rx="2" fill="#fff" opacity="0.18"/>
  </g>
</svg>
