<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Apple Watch">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <radialGradient id="wglow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#ff375f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff375f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wcase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#9a9aa2"/>
